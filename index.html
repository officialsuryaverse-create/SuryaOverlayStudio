<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surya Overlay Studio</title>

<link rel="stylesheet" href="style.css">

<style>

#splash{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
transition:opacity 1s ease;
}

#splash img{
width:100%;
height:100%;
object-fit:cover;
}

.hideSplash{
opacity:0;
pointer-events:none;
}

</style>

</head>

<body>

<!-- Splash Screen -->
<div id="splash">
<img src="splash.png">
</div>

<!-- Main App -->
<div class="container">

<h1>Surya Overlay Studio</h1>

<input type="text" id="heading" placeholder="Heading">

<input type="text" id="ticker" placeholder="Running Text">

<input type="text" id="logo" placeholder="Logo Image URL">

<label>
<input type="checkbox" id="live" checked>
Show LIVE Badge
</label>

<label>Text Speed</label>
<input type="range" id="speed" min="5" max="50" value="20">

<label>Font Size</label>
<input type="range" id="fontsize" min="18" max="50" value="28">

<label>Ticker Height</label>
<input type="range" id="height" min="30" max="100" value="50">

<label>Text Color</label>
<input type="color" id="color" value="#ffffff">

<button onclick="generateOverlay()">
Generate Overlay Link
</button>

<div id="result"></div>

</div>

<script src="script.js"></script>

<script>

window.onload=function(){

setTimeout(function(){

document.getElementById("splash").classList.add("hideSplash");

},5000);

};

</script>

</body>
</html>
